<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LinkedIn Queue Assistant</title>
<style>
  :root {
    --paper: #EDF1EE; --card: #FFFFFF; --ink: #17251F; --muted: #5A6962;
    --line: #D6DED8; --accent: #0E6B5C; --accent-ink: #0A5246;
    --amber: #9A5B12; --amber-bg: #F5E8D4;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 360px; background: var(--paper); color: var(--ink);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { padding: 14px; }
  h1 { font-family: var(--mono); font-size: 14px; font-weight: 700;
    letter-spacing: -0.3px; margin: 0 0 10px; }
  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .settings label { display: flex; flex-direction: column; gap: 3px;
    font-size: 11px; color: var(--muted); }
  input[type=text], input[type=password] { font: 12px var(--mono);
    padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--ink); }
  .hint { color: var(--muted); font-size: 11.5px; margin: 2px 0 10px; }
  button.primary { width: 100%; background: var(--accent); color: #fff;
    border: 0; border-radius: 6px; padding: 9px; font: 600 13px system-ui;
    cursor: pointer; }
  button.primary:hover { background: var(--accent-ink); }
  button.primary:disabled { opacity: .5; cursor: default; }
  .status { margin: 8px 0; font-size: 12px; color: var(--muted); min-height: 16px; }
  .status.err { color: #8C2F1B; }
  .results { max-height: 300px; overflow-y: auto; display: flex;
    flex-direction: column; gap: 6px; }
  .item { background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 9px; }
  .item .row1 { display: flex; justify-content: space-between; gap: 8px;
    align-items: baseline; }
  .item .title { font-weight: 600; font-size: 12.5px; }
  .item .company { color: var(--muted); font-size: 11.5px; }
  .badge { font-family: var(--mono); font-size: 10.5px; border-radius: 8px;
    padding: 0 6px; white-space: nowrap; }
  .badge.queued { background: var(--accent); color: #fff; }
  .badge.skip { background: var(--amber-bg); color: var(--amber); }
  .item .fit { margin-top: 3px; font-size: 11px; color: var(--accent-ink); }
  .item .flags { margin-top: 3px; font-size: 11px; color: var(--amber); }
</style>
</head>
<body>
<div class="wrap">
  <h1>LinkedIn Queue Assistant</h1>

  <div class="settings">
    <label>Server URL
      <input type="text" id="serverUrl" placeholder="http://127.0.0.1:3000">
    </label>
    <label>Token
      <input type="password" id="token" placeholder="[extension].token">
    </label>
  </div>

  <button class="primary" id="scanBtn">Scan this page</button>
  <div class="status" id="status"></div>
  <div class="results" id="results"></div>
</div>
<script src="popup.js"></script>
</body>
</html>

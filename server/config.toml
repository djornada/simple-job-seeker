# Daily queue agent — configuration

[targets]
per_day = 10                  # how many companies per daily queue
company_cooldown_days = 30    # don't re-queue the same company within N days
# roles to look for at each company (used to build LinkedIn search links)
people_roles = ["Technical Recruiter", "Engineering Manager"]

[sources]
enabled = ["remoteok", "remotive", "wwr", "hn"]  # hn = HN "Who is hiring?"
remotive_searches = ["react", "frontend", "full stack", "node"]
wwr_feeds = [
    "https://weworkremotely.com/categories/remote-front-end-programming-jobs.rss",
    "https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss",
]

[filters]
# at least one role keyword must match the job TITLE
role_keywords = [
    "senior", "staff", "lead", "principal",
    "frontend", "front-end", "front end",
    "fullstack", "full-stack", "full stack",
]
# each stack keyword found in title/tags adds to the score
stack_keywords = [
    "react", "next.js", "nextjs", "typescript",
    "node", "nestjs", "azure", "gcp", "javascript",
]
# reject if any of these appear in the title
exclude_keywords = [
    "junior", "intern", "unpaid", "wordpress", "php",
    "director", "vp ", "recruiter",
]
# keep only jobs whose location allows hiring from Brazil
# (worldwide / anywhere / LATAM / americas / brazil / global / remote)
brazil_friendly_only = true

# Resume-in-the-loop: LLM re-rank of the keyword-gated queue against your
# imported profile (python profile.py import <export.zip>). With no profile
# or Ollama down, the pipeline stays keyword-only.
[resume]
shortlist = 30       # jobs sent to LLM re-rank after keyword gate
min_llm_score = 5    # drop jobs the model scores below this (0 disables)

[web]
host = "127.0.0.1"   # keep it local: state.db holds data about real people
port = 3000

[llm]
# Which backend drives the re-rank and connection-note stages.
#   "ollama" — local model (default, private, no API key)
#   "openai" — any OpenAI-compatible chat endpoint (e.g. NVIDIA NIM)
provider = "openai"

[ollama]
url = "http://localhost:11434"
model = "qwen3.5"

# OpenAI-compatible endpoint, used when [llm].provider = "openai".
# The API key is read from the named environment variable, never committed.
# Set it via a local .env file (gitignored) — NVIDIA_API_KEY="nvapi-..." —
# or export it in your shell.
[openai]
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
model = "z-ai/glm-5.2"

# The Chrome extension (extension/) POSTs items it reads off LinkedIn to
# /api/rate for scoring. Blank token = endpoint disabled. Set any random
# string here and paste the same value into the extension's popup.
[extension]
token = ""

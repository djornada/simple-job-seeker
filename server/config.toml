# Daily queue agent — configuration

[targets]
per_day = 30                  # how many companies per daily queue
company_cooldown_days = 30    # don't re-queue the same company within N days
# roles to look for at each company (used to build LinkedIn search links)
people_roles = ["Technical Recruiter", "Engineering Manager"]

[sources]
enabled = ["remoteok", "remotive", "wwr", "hn", "freehire"]  # hn = HN "Who is hiring?"
remotive_searches = ["react", "frontend", "full stack", "node"]
wwr_feeds = [
    "https://weworkremotely.com/categories/remote-front-end-programming-jobs.rss",
    "https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss",
]
# freehire.me: one API over ~50 ATS boards (Greenhouse, Lever, Ashby, Gupy...).
# Remote roles only; regions and countries are OR'd into one location filter.
freehire_searches = ["react", "frontend", "full stack", "node"]
freehire_regions = ["latam", "global"]
freehire_countries = ["br"]
freehire_days = 14  # posted within the last N days
# freehire sub-sources to drop (prefix match): remotive is already a source,
# whatjobs-* links are paid-click redirects
freehire_skip = ["remotive", "whatjobs"]

[filters]
# at least one role keyword must match the job TITLE
role_keywords = [
    "senior", "staff", "lead", "principal",
    "frontend", "front-end", "front end",
    "fullstack", "full-stack", "full stack",
]
# each stack keyword found in title/tags adds to the score
stack_keywords = [
    "react", "next.js", "nextjs", "typescript",
    "node", "nestjs", "azure", "gcp", "javascript",
]
# reject if any of these appear in the title
exclude_keywords = [
    "junior", "intern", "unpaid", "wordpress", "php",
    "director", "vp ", "recruiter",
]
# keep only jobs whose location allows hiring from Brazil
# (worldwide / anywhere / LATAM / americas / brazil / global / remote)
brazil_friendly_only = true

# Language and eligibility gates: reject postings you can't be hired for
# before they spend an LLM call. Delete this table to turn them off.
[gates]
# Languages you can work in, with your level (CEFR A1-C2 or "native").
# A posting that requires a language missing here is rejected; one asking
# for a higher level than yours is kept with a flag. Empty = no language gate.
languages = { english = "C1", portuguese = "native" }
# Phrases in the posting text that mean you can't be hired. Case-insensitive,
# matched at a word start ("us citizen" also catches "US citizens").
eligibility_blockers = [
    "us citizen", "u.s. citizen", "green card", "security clearance",
    "authorized to work in the us", "eu citizen", "eu work permit",
    "right to work in the uk",
]
# Location or title text that restricts hiring to one region, even when
# "remote". Applies whether or not brazil_friendly_only is on.
region_only = [
    "us only", "usa only", "u.s. only", "eu only", "uk only",
    "canada only", "north america only", "remote - us", "remote (us)",
]

# Resume-in-the-loop: LLM re-rank of the keyword-gated queue against your
# imported profile (python profile.py import <export.zip>). With no profile
# or Ollama down, the pipeline stays keyword-only.
[resume]
shortlist = 30       # min jobs sent to LLM re-rank (a build judges 1.5x per_day if more)
min_llm_score = 5    # drop jobs scoring below this, 0-10 (0 disables)
# Optional: what you want next, so the "career" dimension has something to
# judge against (otherwise the model reads your profile's trajectory).
# goals = "Staff-level frontend or full-stack role, product company, async remote"

# The model scores each job 0-100 on four dimensions; the overall score is
# their weighted average (computed here, not by the model), and the 0-10
# score above is overall / 10. Verdicts: strong >= 75, good >= 60,
# moderate >= 45, weak >= 30, poor below.
[resume.weights]
skills = 30
experience = 25
culture = 15
career = 30

# Skill-name aliases, variant = canonical, used to merge spellings on the
# /gaps page (and by keyword coverage). Matching is case-insensitive.
[keywords.aliases]
k8s = "kubernetes"
js = "javascript"
ts = "typescript"
postgres = "postgresql"
"next.js" = "nextjs"
"node.js" = "node"
nodejs = "node"
"react.js" = "react"
reactjs = "react"

# Expired-posting check (python3 queue_agent.py --recheck). Re-visits the
# archived postings' own URLs on the boards, never LinkedIn, one second
# apart; a 404/410 marks the posting expired.
[expiry]
max_checks = 50    # requests per run
min_age_days = 2   # leave freshly queued postings alone
recheck_days = 3   # don't re-check a posting more often than this

# Applications (tracker.py apply/move/stale/sweep, /applications, /board).
# "Quiet" = days since the application's last activity, open statuses only.
[applications]
followup_after_days = 10     # quiet this long → suggest a follow-up
max_followups = 2            # stop suggesting after this many
no_response_after_days = 60  # quiet this long → offer the no-response sweep

[web]
host = "127.0.0.1"   # keep it local: state.db holds data about real people
port = 3000

[llm]
# Which backend drives the re-rank and connection-note stages.
#   "ollama" — local model (default, private, no API key)
#   "openai" — any OpenAI-compatible chat endpoint (e.g. NVIDIA NIM)
provider = "ollama"

[ollama]
url = "http://localhost:11434"
model = "qwen3:14b"

# OpenAI-compatible endpoint, used when [llm].provider = "openai".
# The API key is read from the named environment variable, never committed.
# Set it via a local .env file (gitignored) — NVIDIA_API_KEY="nvapi-..." —
# or export it in your shell.
[openai]
base_url = "https://integrate.api.nvidia.com/v1"
api_key_env = "NVIDIA_API_KEY"
model = "z-ai/glm-5.2"

# The Chrome extension (extension/) POSTs items it reads off LinkedIn to
# /api/rate for scoring. Blank token = endpoint disabled. Set any random
# string here and paste the same value into the extension's popup.
[extension]
token = ""
